services:
  rabbitmq-a:
    image: rabbitmq:management
    container_name: rabbitmq-a
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      - RABBITMQ_DEFAULT_USER=dev
      - RABBITMQ_DEFAULT_PASS=dev
      - RABBITMQ_ERLANG_COOKIE="super_secret_cookie"
      - RABBITMQ_NODENAME=mes-shopfloor@rabbitmq-a
    volumes:
      - mes-shopfloor-rmq-a-lib:/var/lib/rabbitmq/
      - mes-shopfloor-rmq-a-log:/var/log/rabbitmq/
    networks:
      - mes-shopfloor

  rabbitmq-b:
    image: rabbitmq:management
    container_name: rabbitmq-b
    ports:
      - 5673:5672
      - 15673:15672
    environment:
      - RABBITMQ_DEFAULT_USER=dev
      - RABBITMQ_DEFAULT_PASS=dev
      - RABBITMQ_ERLANG_COOKIE="super_secret_cookie"
      - RABBITMQ_NODENAME=mes-shopfloor@rabbitmq-b
    volumes:
      - mes-shopfloor-rmq-b-lib:/var/lib/rabbitmq/
      - mes-shopfloor-rmq-b-log:/var/log/rabbitmq/
    networks:
      - mes-shopfloor

  ravendb-a:
    image: ravendb/ravendb:7.2-latest
    container_name: ravendb-a
    ports:
      - "8080:8080"
      - "38888:38888"
    volumes:
      - mes-shopfloor-rdb-a:/var/lib/ravendb/data
      - ./ravendb/license:/var/lib/ravendb/server/license
    environment:
        - RAVEN_Security_UnsecuredAccessAllowed=PublicNetwork
        - RAVEN_Setup_Mode=None
        - RAVEN_License_Eula_Accepted=true
        - RAVEN_ServerUrl=http://0.0.0.0:8080
        - RAVEN_PublicServerUrl=http://192.168.0.71:8080
        - RAVEN_ServerUrl_Tcp=tcp://0.0.0.0:38888
        - RAVEN_PublicServerUrl_Tcp=tcp://192.168.0.71:38888
        - RAVEN_License_Path=/var/lib/ravendb/server/license/license.json
    networks:
      - mes-shopfloor

  ravendb-b:
    image: ravendb/ravendb:7.2-latest
    container_name: ravendb-b
    ports:
      - "8081:8080"
      - "38889:38888"
    volumes:
      - mes-shopfloor-rdb-b:/var/lib/ravendb/data
      - ./ravendb/license:/var/lib/ravendb/server/license
    environment:
        - RAVEN_Security_UnsecuredAccessAllowed=PublicNetwork
        - RAVEN_Setup_Mode=None
        - RAVEN_License_Eula_Accepted=true
        - RAVEN_ServerUrl=http://0.0.0.0:8080
        - RAVEN_PublicServerUrl=http://192.168.0.71:8081
        - RAVEN_ServerUrl_Tcp=tcp://0.0.0.0:38888
        - RAVEN_PublicServerUrl_Tcp=tcp://192.168.0.71:38889
        - RAVEN_License_Path=/var/lib/ravendb/server/license/license.json
    networks:
      - mes-shopfloor
    depends_on:
      - ravendb-a

  # postgres:
  #   image: postgres:latest
  #   container_name: postgres
  #   ports:
  #     - 5432:5432
  #   environment:
  #     - POSTGRES_USER=dev
  #     - POSTGRES_PASSWORD=dev
  #   volumes:
  #     - mes-shopfloor-pg:/var/lib/postgresql
  #   networks:
  #     - mes-shopfloor

volumes:
  mes-shopfloor-rmq-a-lib:
  mes-shopfloor-rmq-a-log:
  mes-shopfloor-rmq-b-lib:
  mes-shopfloor-rmq-b-log:
  mes-shopfloor-rdb-a:
  mes-shopfloor-rdb-b:
  # mes-shopfloor-pg:

networks:
  mes-shopfloor:
    driver: bridge